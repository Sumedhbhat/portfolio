name: Resume

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - "resume-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Check and build PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Lint and compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: source/resume.tex
          pre_compile: |
            mkdir -p build
            make test
            make lint
          args: >-
            -pdf
            -file-line-error
            -halt-on-error
            -interaction=nonstopmode
            -outdir=build
            -jobname=Sumedh_S_Bhat

      - name: Verify PDF
        run: |
          test -s build/Sumedh_S_Bhat.pdf
          ! grep -Eq 'Overfull \\hbox|fancyhdr Warning' build/Sumedh_S_Bhat.log

      - name: Upload release PDF artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/resume-'))
        uses: actions/upload-artifact@v7
        with:
          name: Sumedh_S_Bhat-${{ github.ref_name }}
          path: build/Sumedh_S_Bhat.pdf
          if-no-files-found: error

  release-tagged-variant:
    name: Publish tagged variant release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/resume-')
    needs: check-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v7
        with:
          name: Sumedh_S_Bhat-${{ github.ref_name }}
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ASSET: release/Sumedh_S_Bhat-${{ github.ref_name }}.pdf
        run: |
          mv release/Sumedh_S_Bhat.pdf "$RELEASE_ASSET"
          gh release create "$RELEASE_TAG" \
            "$RELEASE_ASSET#Sumedh_S_Bhat - $RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Resume - $RELEASE_TAG" \
            --generate-notes

  release-master:
    name: Publish master release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v7
        with:
          name: Sumedh_S_Bhat-master
          path: release

      - name: Create build-numbered release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: release-master-${{ github.run_number }}
          RELEASE_ASSET: release/Sumedh_S_Bhat-release-master-${{ github.run_number }}.pdf
        run: |
          mv release/Sumedh_S_Bhat.pdf "$RELEASE_ASSET"
          gh release create "$RELEASE_TAG" \
            "$RELEASE_ASSET#Sumedh_S_Bhat - $RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Resume - $RELEASE_TAG" \
            --generate-notes
