<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sumedh S Bhat’s portfolio, presented as a reader’s edition with alternate archive, query, and graph experiences." />
    <title>Reader’s Edition · Sumedh S Bhat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <style>
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { margin:0; min-width:320px; }
      img { display:block; max-width:100%; }
      a { color:inherit; }
      button { font:inherit; }
      a:focus-visible, button:focus-visible, summary:focus-visible { outline:3px solid #ffb000; outline-offset:4px; }
      .edition-return { position:fixed; z-index:1000; left:18px; bottom:18px; display:flex; align-items:center; gap:10px; padding:12px 16px; border:1px solid rgba(255,255,255,.2); border-radius:999px; color:#f7f7f2; background:#111318; box-shadow:0 14px 38px rgba(0,0,0,.32); cursor:pointer; font:500 11px/1.2 "DM Mono",monospace; letter-spacing:.04em; }
      .edition-return:hover { background:#272b34; }
      .edition-return span { color:#b8bec9; font-size:15px; }
      html[data-current-variant="A"] .edition-return { right:18px; left:auto; }
      .external::after { content:" ↗"; }
      .tag-list { display:flex; flex-wrap:wrap; gap:6px; margin:16px 0 0; padding:0; list-style:none; }
      .project-links { display:flex; flex-wrap:wrap; gap:15px; margin-top:18px; }
      .project-links a { font-size:12px; font-weight:700; text-underline-offset:4px; }

      /* A — Profile + archive. Persistent identity; complete record alongside it. */
      .layout-a { --paper:#f1f4f2; --ink:#17201c; --muted:#62706a; --line:#cad2ce; --accent:#315ee7; min-height:100vh; color:var(--ink); background:var(--paper); font-family:Manrope,sans-serif; }
      .a-shell { width:min(1480px,100%); margin:auto; display:grid; grid-template-columns:minmax(330px,42%) minmax(0,58%); }
      .a-profile { position:sticky; top:0; align-self:start; min-height:100vh; padding:55px clamp(32px,5vw,82px) 110px; display:flex; flex-direction:column; border-right:1px solid var(--line); }
      .a-id { display:grid; grid-template-columns:72px 1fr; gap:20px; align-items:center; }
      .a-id img { width:72px; aspect-ratio:1; object-fit:cover; border-radius:20px; }
      .a-id h1 { margin:0; font:700 22px/1.1 "Space Grotesk",sans-serif; letter-spacing:-.04em; }
      .a-id p { margin:6px 0 0; color:var(--muted); font-size:12px; }
      .a-profile h2 { margin:65px 0 22px; max-width:580px; font:600 clamp(38px,4vw,66px)/.98 "Space Grotesk",sans-serif; letter-spacing:-.055em; }
      .a-profile > p { max-width:550px; margin:0; color:var(--muted); font-size:15px; line-height:1.75; }
      .a-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:38px 0; }
      .a-stat { padding-top:16px; border-top:1px solid var(--line); }
      .a-stat b { display:block; font:600 21px "Space Grotesk"; }
      .a-stat span { display:block; margin-top:5px; color:var(--muted); font:400 9px/1.4 "DM Mono"; text-transform:uppercase; }
      .a-nav { display:grid; gap:8px; margin-top:auto; }
      .a-nav a { display:flex; align-items:center; gap:12px; width:max-content; color:var(--muted); font:500 11px "DM Mono"; letter-spacing:.06em; text-decoration:none; text-transform:uppercase; }
      .a-nav a::before { content:""; width:24px; height:1px; background:currentColor; transition:width .2s; }
      .a-nav a:hover { color:var(--accent); }
      .a-nav a:hover::before { width:42px; }
      .a-social { display:flex; flex-wrap:wrap; gap:18px; margin-top:30px; font-size:11px; font-weight:700; }
      .a-content { padding:55px clamp(32px,5vw,78px) 150px; }
      .a-section { padding:0 0 88px; scroll-margin-top:30px; }
      .a-section-head { display:flex; align-items:baseline; justify-content:space-between; gap:25px; padding-bottom:18px; border-bottom:1px solid var(--ink); }
      .a-section-head h2 { margin:0; font:600 clamp(28px,3vw,42px) "Space Grotesk"; letter-spacing:-.045em; }
      .a-section-head span { color:var(--muted); font:400 10px "DM Mono"; text-transform:uppercase; }
      .a-work { padding:30px 0; border-bottom:1px solid var(--line); }
      .a-work-top { display:grid; grid-template-columns:1fr auto; gap:22px; }
      .a-work h3 { margin:0; font:600 21px/1.2 "Space Grotesk"; letter-spacing:-.025em; }
      .a-work .meta { margin:7px 0 0; color:var(--accent); font:500 10px "DM Mono"; text-transform:uppercase; }
      .a-work .status { color:var(--muted); font:400 9px "DM Mono"; text-transform:uppercase; }
      .a-work p { max-width:720px; margin:16px 0 0; color:var(--muted); font-size:14px; line-height:1.7; }
      .a-impact { margin-top:14px; color:var(--ink); font-size:13px; font-weight:700; }
      .layout-a .tag-list li { padding:6px 9px; border-radius:4px; color:#274fc8; background:#e0e7ff; font:500 9px "DM Mono"; }
      .a-project-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:28px; }
      .a-project { min-height:255px; display:flex; flex-direction:column; padding:24px; border:1px solid var(--line); border-radius:12px; background:#f8faf8; }
      .a-project small { color:var(--accent); font:500 9px "DM Mono"; text-transform:uppercase; }
      .a-project h3 { margin:18px 0 10px; font:600 20px "Space Grotesk"; letter-spacing:-.03em; }
      .a-project p { margin:0; color:var(--muted); font-size:13px; line-height:1.6; }
      .a-project .project-links { margin-top:auto; padding-top:20px; }
      .a-experience { display:grid; grid-template-columns:130px 1fr; gap:26px; padding:28px 0; border-bottom:1px solid var(--line); }
      .a-experience time { color:var(--muted); font:400 10px/1.5 "DM Mono"; }
      .a-experience h3 { margin:0; font:600 19px "Space Grotesk"; }
      .a-experience h3 span { color:var(--muted); font-weight:400; }
      .a-experience p { margin:10px 0 0; color:var(--muted); font-size:13px; line-height:1.65; }
      .a-skill-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:26px; }
      .a-skill { padding:20px; border:1px solid var(--line); border-radius:10px; }
      .a-skill h3 { margin:0 0 10px; font:600 13px "DM Mono"; text-transform:uppercase; }
      .a-skill p { margin:0; color:var(--muted); font-size:13px; line-height:1.65; }
      .a-recognition { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:26px; }
      .a-recognition article { padding:20px; border-top:3px solid var(--accent); background:#f8faf8; }
      .a-recognition small { color:var(--muted); font:400 9px "DM Mono"; text-transform:uppercase; }
      .a-recognition h3 { margin:10px 0 0; font-size:15px; line-height:1.4; }

      /* B — Work library. Filterable collection leads; biography supports. */
      .layout-b { --paper:#faf9f4; --ink:#171713; --muted:#69675f; --line:#d8d4c6; --blue:#104ed8; --orange:#ef6b32; min-height:100vh; color:var(--ink); background:var(--paper); font-family:"Space Grotesk",sans-serif; }
      .b-shell { width:min(1420px,100%); margin:auto; padding:0 38px 150px; }
      .b-nav { position:sticky; z-index:20; top:0; display:flex; align-items:center; justify-content:space-between; min-height:76px; border-bottom:1px solid var(--ink); background:rgba(250,249,244,.94); backdrop-filter:blur(14px); }
      .b-nav strong { font-size:17px; letter-spacing:-.035em; }
      .b-nav div { display:flex; gap:24px; }
      .b-nav a { font:500 10px "DM Mono"; text-decoration:none; text-transform:uppercase; }
      .b-intro { display:grid; grid-template-columns:1.4fr .6fr; gap:55px; padding:68px 0 56px; border-bottom:1px solid var(--line); }
      .b-intro h1 { margin:0; max-width:850px; font:600 clamp(45px,6vw,84px)/.98 "Space Grotesk"; letter-spacing:-.065em; }
      .b-intro-side { display:flex; flex-direction:column; justify-content:space-between; gap:30px; }
      .b-intro-side p { margin:0; color:var(--muted); font-size:15px; line-height:1.7; }
      .b-counts { display:flex; gap:26px; }
      .b-counts b { display:block; color:var(--blue); font-size:22px; }
      .b-counts span { font:400 9px "DM Mono"; text-transform:uppercase; }
      .b-section { padding:76px 0 10px; scroll-margin-top:90px; }
      .b-title-row { display:flex; align-items:end; justify-content:space-between; gap:30px; margin-bottom:26px; }
      .b-title-row h2 { margin:0; font:600 clamp(32px,4vw,54px) "Space Grotesk"; letter-spacing:-.05em; }
      .b-title-row p { max-width:500px; margin:0; color:var(--muted); font-size:13px; line-height:1.6; }
      .b-filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
      .b-filter { padding:9px 13px; border:1px solid var(--ink); border-radius:999px; color:var(--ink); background:transparent; cursor:pointer; font:500 10px "DM Mono"; text-transform:uppercase; }
      .b-filter.is-active, .b-filter:hover { color:white; background:var(--ink); }
      .b-library { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--ink); border-left:1px solid var(--ink); }
      .b-card { min-height:310px; display:flex; flex-direction:column; padding:24px; border-right:1px solid var(--ink); border-bottom:1px solid var(--ink); }
      .b-card[hidden] { display:none; }
      .b-card-top { display:flex; justify-content:space-between; gap:20px; color:var(--muted); font:400 9px "DM Mono"; text-transform:uppercase; }
      .b-card h3 { margin:42px 0 13px; font:600 23px/1.05 "Space Grotesk"; letter-spacing:-.035em; }
      .b-card p { margin:0; color:var(--muted); font-size:13px; line-height:1.6; }
      .b-card .project-links { margin-top:auto; padding-top:20px; }
      .b-card:nth-child(4n+1) { background:#edf2ff; }
      .b-card:nth-child(4n+3) { background:#fff0e7; }
      .layout-b .tag-list li { color:var(--muted); font:400 9px "DM Mono"; }
      .layout-b .tag-list li:not(:last-child)::after { content:" ·"; }
      .b-timeline { border-top:1px solid var(--ink); }
      .b-role { display:grid; grid-template-columns:160px 1fr 1.4fr; gap:30px; padding:25px 0; border-bottom:1px solid var(--line); }
      .b-role time { color:var(--muted); font:400 10px "DM Mono"; }
      .b-role h3 { margin:0; font-size:17px; }
      .b-role h3 span { display:block; margin-top:5px; color:var(--blue); font:500 10px "DM Mono"; }
      .b-role p { margin:0; color:var(--muted); font-size:13px; line-height:1.65; }
      .b-bottom { display:grid; grid-template-columns:1fr 1fr; gap:60px; }
      .b-list { border-top:1px solid var(--ink); }
      .b-list article { padding:20px 0; border-bottom:1px solid var(--line); }
      .b-list small { color:var(--orange); font:500 9px "DM Mono"; text-transform:uppercase; }
      .b-list h3 { margin:8px 0 0; font-size:15px; line-height:1.45; }
      .b-skills { display:grid; grid-template-columns:1fr 1fr; gap:18px; padding-top:20px; border-top:1px solid var(--ink); }
      .b-skills h3 { margin:0 0 8px; font:500 10px "DM Mono"; text-transform:uppercase; }
      .b-skills p { margin:0; color:var(--muted); font-size:12px; line-height:1.65; }

      /* C — Casebook. Professional work gets full narratives; public work remains indexed. */
      .layout-c { --paper:#eaf1f3; --ink:#152328; --muted:#5e7076; --line:#b7c8cd; --wine:#8b2942; --yellow:#f4cc55; min-height:100vh; color:var(--ink); background:var(--paper); font-family:Newsreader,serif; }
      .c-shell { width:min(1340px,100%); margin:auto; padding:24px 46px 150px; }
      .c-nav { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:10px 0 20px; border-bottom:2px solid var(--ink); font:700 10px Manrope,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
      .c-nav span:nth-child(2) { justify-self:center; }
      .c-nav .links { justify-self:end; display:flex; gap:20px; }
      .c-nav a { text-decoration:none; }
      .c-intro { display:grid; grid-template-columns:1.15fr .85fr; gap:65px; padding:66px 0 60px; border-bottom:1px solid var(--ink); }
      .c-intro h1 { margin:0; font:500 clamp(52px,7vw,96px)/.89 Newsreader,serif; letter-spacing:-.055em; }
      .c-intro h1 em { color:var(--wine); font-style:italic; }
      .c-bio { align-self:end; }
      .c-bio p { margin:0; font-size:18px; line-height:1.55; }
      .c-bio-meta { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:28px; font:600 10px Manrope,sans-serif; text-transform:uppercase; }
      .c-bio-meta span { padding-top:10px; border-top:1px solid var(--line); }
      .c-section { padding-top:92px; scroll-margin-top:20px; }
      .c-section-label { display:grid; grid-template-columns:160px 1fr; gap:40px; margin-bottom:48px; }
      .c-section-label span { padding-top:8px; border-top:5px solid var(--wine); font:700 10px/1.5 Manrope,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
      .c-section-label h2 { margin:0; font:500 clamp(42px,5vw,68px)/.95 Newsreader,serif; letter-spacing:-.04em; }
      .c-case { display:grid; grid-template-columns:160px 1fr; gap:40px; padding:42px 0; border-top:1px solid var(--line); }
      .c-case-meta { font:600 9px/1.7 Manrope,sans-serif; text-transform:uppercase; }
      .c-case-meta strong { display:block; color:var(--wine); }
      .c-case h3 { margin:0; font:500 34px/1 Newsreader,serif; letter-spacing:-.025em; }
      .c-case p { max-width:820px; margin:16px 0 0; font-size:16px; line-height:1.65; }
      .c-case .impact { margin-top:18px; padding:14px 16px; border-left:5px solid var(--yellow); background:rgba(255,255,255,.35); font:700 12px Manrope,sans-serif; }
      .layout-c .tag-list li { color:var(--muted); font:600 9px Manrope,sans-serif; text-transform:uppercase; }
      .c-project-table { border-top:2px solid var(--ink); }
      .c-project-row { display:grid; grid-template-columns:100px 1fr 1fr auto; gap:24px; align-items:start; padding:24px 0; border-bottom:1px solid var(--line); }
      .c-project-row small { font:600 9px Manrope,sans-serif; text-transform:uppercase; }
      .c-project-row h3 { margin:0; font:500 22px Newsreader,serif; }
      .c-project-row p { margin:0; color:var(--muted); font-size:14px; line-height:1.55; }
      .c-project-row a { font:700 10px Manrope,sans-serif; text-transform:uppercase; }
      .c-history { display:grid; grid-template-columns:1fr 1fr; gap:45px; }
      .c-role { padding:25px 0; border-top:1px solid var(--ink); }
      .c-role time { font:600 9px Manrope,sans-serif; text-transform:uppercase; }
      .c-role h3 { margin:11px 0 8px; font:500 23px Newsreader,serif; }
      .c-role h3 span { color:var(--wine); }
      .c-role p { margin:0; color:var(--muted); font-size:14px; line-height:1.6; }
      .c-footer-grid { display:grid; grid-template-columns:1fr 1fr; gap:50px; }
      .c-box { padding:28px; border:1px solid var(--ink); }
      .c-box h2 { margin:0 0 22px; font:500 30px Newsreader,serif; }
      .c-box article { padding:14px 0; border-top:1px solid var(--line); }
      .c-box article small { color:var(--wine); font:700 9px Manrope,sans-serif; text-transform:uppercase; }
      .c-box article h3 { margin:7px 0 0; font:500 17px Newsreader,serif; }
      .c-skill-group { margin-bottom:18px; }
      .c-skill-group h3 { margin:0 0 5px; color:var(--wine); font:700 9px Manrope,sans-serif; text-transform:uppercase; }
      .c-skill-group p { margin:0; font-size:14px; line-height:1.6; }

      /* D — Documentation. A portfolio as an engineering record. */
      .layout-d { --paper:#f7faf9; --ink:#18221f; --muted:#62706b; --line:#d9e0dd; --accent:#057a62; --soft:#e2f3ee; min-height:100vh; color:var(--ink); background:var(--paper); font-family:Manrope,sans-serif; }
      .d-top { position:sticky; z-index:30; top:0; display:grid; grid-template-columns:260px 1fr auto; gap:24px; align-items:center; height:64px; padding:0 28px; border-bottom:1px solid var(--line); background:rgba(247,250,249,.96); backdrop-filter:blur(14px); }
      .d-top strong { font:700 15px "Space Grotesk"; }
      .d-top .crumb { color:var(--muted); font:400 10px "DM Mono"; }
      .d-top .links { display:flex; gap:18px; font:500 10px "DM Mono"; }
      .d-layout { width:min(1520px,100%); margin:auto; display:grid; grid-template-columns:230px minmax(0,1fr) 250px; }
      .d-nav { position:sticky; top:64px; align-self:start; height:calc(100vh - 64px); padding:34px 24px 110px; border-right:1px solid var(--line); overflow:auto; }
      .d-nav small { display:block; margin-bottom:14px; color:var(--muted); font:500 9px "DM Mono"; text-transform:uppercase; }
      .d-nav a { display:block; padding:8px 10px; border-radius:6px; color:var(--muted); font-size:12px; text-decoration:none; }
      .d-nav a:hover { color:var(--accent); background:var(--soft); }
      .d-main { padding:50px clamp(30px,5vw,78px) 150px; }
      .d-summary { padding-bottom:42px; border-bottom:1px solid var(--line); }
      .d-summary .overline { color:var(--accent); font:500 10px "DM Mono"; text-transform:uppercase; }
      .d-summary h1 { margin:18px 0; font:600 clamp(39px,5vw,68px)/.98 "Space Grotesk"; letter-spacing:-.055em; }
      .d-summary p { max-width:800px; margin:0; color:var(--muted); font-size:16px; line-height:1.75; }
      .d-section { padding-top:64px; scroll-margin-top:84px; }
      .d-section > h2 { margin:0 0 12px; font:600 31px "Space Grotesk"; letter-spacing:-.04em; }
      .d-section > .section-intro { max-width:700px; margin:0 0 30px; color:var(--muted); font-size:14px; line-height:1.7; }
      .d-project { margin-bottom:14px; border:1px solid var(--line); border-radius:10px; background:white; overflow:hidden; }
      .d-project summary { display:grid; grid-template-columns:1fr auto; gap:20px; padding:20px 22px; cursor:pointer; list-style:none; }
      .d-project summary::-webkit-details-marker { display:none; }
      .d-project summary h3 { margin:0; font:600 17px "Space Grotesk"; }
      .d-project summary span { color:var(--accent); font:500 9px "DM Mono"; text-transform:uppercase; }
      .d-project-body { padding:0 22px 22px; }
      .d-project-body p { margin:0; color:var(--muted); font-size:13px; line-height:1.7; }
      .d-callout { margin-top:16px; padding:13px 15px; border-radius:7px; background:var(--soft); color:#075e4d; font-size:12px; font-weight:700; }
      .layout-d .tag-list li { padding:5px 8px; border:1px solid #b9dacf; border-radius:5px; color:#075e4d; font:500 9px "DM Mono"; }
      .d-repo { display:grid; grid-template-columns:1fr auto; gap:22px; padding:19px 0; border-bottom:1px solid var(--line); }
      .d-repo h3 { margin:0 0 7px; font:600 16px "Space Grotesk"; }
      .d-repo p { margin:0; color:var(--muted); font-size:12px; line-height:1.55; }
      .d-repo-links { white-space:nowrap; font:500 10px "DM Mono"; }
      .d-role { display:grid; grid-template-columns:130px 1fr; gap:24px; padding:22px 0; border-bottom:1px solid var(--line); }
      .d-role time { color:var(--muted); font:400 9px/1.6 "DM Mono"; }
      .d-role h3 { margin:0; font:600 16px "Space Grotesk"; }
      .d-role h3 span { color:var(--accent); }
      .d-role p { margin:8px 0 0; color:var(--muted); font-size:13px; line-height:1.6; }
      .d-right { position:sticky; top:64px; align-self:start; height:calc(100vh - 64px); padding:34px 24px 110px; border-left:1px solid var(--line); overflow:auto; }
      .d-right h2 { margin:0 0 16px; font:600 13px "Space Grotesk"; }
      .d-fact { padding:13px 0; border-top:1px solid var(--line); }
      .d-fact b { display:block; color:var(--accent); font:600 18px "Space Grotesk"; }
      .d-fact span { color:var(--muted); font:400 8px/1.45 "DM Mono"; text-transform:uppercase; }
      .d-right h3 { margin:25px 0 8px; color:var(--muted); font:500 9px "DM Mono"; text-transform:uppercase; }
      .d-right p { margin:0; font-size:11px; line-height:1.65; }
      .d-award { padding:14px 0; border-top:1px solid var(--line); }
      .d-award small { color:var(--accent); font:500 8px "DM Mono"; text-transform:uppercase; }
      .d-award p { margin-top:5px; font-weight:600; }

      @media (max-width:1050px) {
        .a-shell { grid-template-columns:1fr; }
        .a-profile { position:relative; min-height:auto; border-right:0; border-bottom:1px solid var(--line); }
        .a-nav { grid-template-columns:repeat(3,auto); justify-content:start; margin-top:45px; }
        .b-library { grid-template-columns:1fr 1fr; }
        .d-layout { grid-template-columns:190px minmax(0,1fr); }
        .d-right { display:none; }
      }
      @media (max-width:760px) {
        .edition-return { left:11px; bottom:11px; }
        html[data-current-variant="A"] .edition-return { right:11px; left:auto; }
        .a-profile, .a-content { padding-left:22px; padding-right:22px; }
        .a-profile { padding-top:30px; padding-bottom:55px; }

      }
      /* A refinement — the selected structure, with stronger portrait and visual rhythm. */
      .layout-a { background:linear-gradient(135deg,#f1f4f2 0%,#f1f4f2 68%,#e8edff 100%); }
      .a-profile { overflow:hidden; background:radial-gradient(circle at 13% 7%,rgba(49,94,231,.14),transparent 28%),var(--paper); }
      .a-profile::after { content:""; position:absolute; z-index:-1; width:210px; height:210px; right:-110px; bottom:18%; border:1px solid rgba(49,94,231,.25); border-radius:50%; box-shadow:0 0 0 34px rgba(49,94,231,.045),0 0 0 68px rgba(49,94,231,.025); }
      .a-id { grid-template-columns:112px 1fr; gap:26px; }

      .a-id-portrait::before { content:"AVAILABLE"; position:absolute; z-index:2; right:-18px; bottom:-8px; padding:5px 7px; border:2px solid var(--paper); border-radius:999px; color:white; background:#13a56f; font:500 7px "DM Mono"; letter-spacing:.08em; }

      .a-id h1 { font-size:25px; }
      .a-profile h2 em { color:var(--accent); font-style:normal; }
      .a-work { position:relative; transition:padding .2s,background .2s; }
      .a-work:hover { padding-left:18px; padding-right:18px; background:rgba(255,255,255,.55); }
      .a-work::before { content:""; position:absolute; left:0; top:30px; width:4px; height:0; border-radius:4px; background:var(--accent); transition:height .2s; }
      .a-work:hover::before { height:42px; }
      .a-project { transition:transform .2s,box-shadow .2s; }
      .a-project:nth-child(4n+1) { background:#eef2ff; }
      .a-project:nth-child(4n+2) { border-top:4px solid #ff7a51; }
      .a-project:hover { transform:translateY(-5px); box-shadow:0 16px 36px rgba(25,38,87,.1); }
      /* C — Field Notes. A colorful editorial portfolio. */
      .layout-c2 { --paper:#f7efe3; --ink:#202116; --red:#f04e36; --blue:#224ed0; --line:#b9b0a2; min-height:100vh; color:var(--ink); background:var(--paper); font-family:Manrope,sans-serif; }

      .c2-hero { display:grid; grid-template-columns:1.2fr .8fr; border-bottom:3px solid var(--ink); }

      .c2-projects { display:grid; grid-template-columns:repeat(2,1fr); border-top:2px solid var(--ink); border-left:2px solid var(--ink); }
      .c2-project { min-height:290px; display:flex; flex-direction:column; padding:28px; border-right:2px solid var(--ink); border-bottom:2px solid var(--ink); }

      /* D — Studio Board. A vivid, modular portfolio mosaic. */
      .layout-d2 { --ink:#15171a; --paper:#f4f3ee; --purple:#7557ff; --yellow:#f6d54a; --cyan:#5ed8df; --pink:#ff8378; min-height:100vh; color:var(--ink); background:var(--paper); font-family:"Space Grotesk",sans-serif; }

      .d2-nav strong { font-size:15px; }
      .d2-nav div { display:flex; gap:18px; }
      .d2-nav a { font:500 9px "DM Mono"; text-decoration:none; text-transform:uppercase; }

      .d2-intro p { max-width:670px; margin:auto 0 0; color:#ebe7ff; font-size:14px; line-height:1.7; }
      .d2-face { grid-row:span 2; padding:0; background:var(--pink); }
      .d2-face img { width:100%; height:100%; object-fit:cover; object-position:center 18%; }
      .d2-face span { position:absolute; left:16px; bottom:16px; padding:8px 10px; border:2px solid var(--ink); border-radius:999px; background:var(--yellow); font:600 8px "DM Mono"; text-transform:uppercase; }
      .d2-stat { display:flex; flex-direction:column; justify-content:space-between; }
      .d2-stat:nth-child(3) { background:var(--yellow); }
      .d2-stat:nth-child(4) { background:var(--cyan); }
      .d2-stat b { font-size:62px; line-height:1; letter-spacing:-.06em; }
      .d2-stat span { font:600 10px/1.5 "DM Mono"; text-transform:uppercase; }
      .d2-section { padding:95px 0 0; scroll-margin-top:20px; }
      .d2-head { display:flex; align-items:end; justify-content:space-between; gap:30px; margin-bottom:35px; }
      .d2-head h2 { margin:0; font-size:clamp(42px,6vw,78px); line-height:.9; letter-spacing:-.06em; }
      .d2-head p { max-width:520px; margin:0; font-size:13px; line-height:1.65; }
      .d2-work-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }
      .d2-work { grid-column:span 3; min-height:330px; display:flex; flex-direction:column; padding:28px; border:2px solid var(--ink); border-radius:18px; background:white; }
      .d2-work:nth-child(3n+1) { grid-column:span 4; background:#dcd4ff; }
      .d2-work:nth-child(3n+2) { grid-column:span 2; background:#fff3b2; }
      .d2-work small { font:600 9px "DM Mono"; text-transform:uppercase; }
      .d2-work h3 { max-width:560px; margin:30px 0 12px; font-size:27px; line-height:1; }
      .d2-work p { margin:0; font-size:13px; line-height:1.65; }
      .d2-work .d2-impact { margin-top:auto; padding-top:25px; font-weight:700; }
      .layout-d2 .tag-list li { padding:6px 8px; border:1px solid var(--ink); border-radius:999px; font:500 8px "DM Mono"; }
      .d2-projects { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
      .d2-project { min-height:310px; display:flex; flex-direction:column; padding:23px; border:2px solid var(--ink); border-radius:18px; background:white; }
      .d2-project:nth-child(4n+1) { background:var(--cyan); }
      .d2-project:nth-child(4n+3) { background:#ffd4d0; }
      .d2-project small { font:600 8px "DM Mono"; text-transform:uppercase; }
      .d2-project h3 { margin:28px 0 10px; font-size:21px; }
      .d2-project p { margin:0; font-size:12px; line-height:1.6; }
      .d2-project .project-links { margin-top:auto; padding-top:18px; }
      .d2-profile-band { display:grid; grid-template-columns:320px 1fr; min-height:430px; margin-top:95px; border:2px solid var(--ink); border-radius:22px; background:var(--yellow); overflow:hidden; box-shadow:8px 8px 0 var(--ink); }

      .d2-profile-copy { display:flex; flex-direction:column; justify-content:center; padding:50px; }
      .d2-profile-copy small { font:600 9px "DM Mono"; text-transform:uppercase; }
      .d2-profile-copy h2 { margin:18px 0; font-size:clamp(38px,5vw,68px); line-height:.92; letter-spacing:-.055em; }
      .d2-profile-copy p { max-width:750px; margin:0; font-size:14px; line-height:1.7; }
      .d2-career { display:grid; grid-template-columns:repeat(5,1fr); border:2px solid var(--ink); border-radius:18px; overflow:hidden; }
      .d2-role { min-height:260px; padding:22px; border-right:2px solid var(--ink); background:white; }
      .d2-role:last-child { border-right:0; }
      .d2-role time { font:600 8px "DM Mono"; text-transform:uppercase; }
      .d2-role h3 { margin:24px 0 12px; font-size:17px; }
      .d2-role h3 span { display:block; margin-top:6px; color:var(--purple); }

      .d2-bottom { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:95px; }
      .d2-box { padding:30px; border:2px solid var(--ink); border-radius:20px; background:#dcd4ff; }

      .d2-box article,.d2-skill { padding:14px 0; border-top:1px solid var(--ink); }
      .d2-box small,.d2-skill h3 { font:600 8px "DM Mono"; text-transform:uppercase; }

      @media (max-width:1050px) {
        .d2-projects { grid-template-columns:1fr 1fr; }

        .d2-intro,.d2-face { grid-row:auto; }

        .d2-career { grid-template-columns:1fr 1fr; }

      }
      @media (max-width:760px) {

        .c2-hero { grid-template-columns:1fr; }
        .c2-title { padding:42px 0; }
        .c2-title h1 { font-size:62px; }
        .c2-portrait { min-height:480px; border-left:0; border-top:3px solid var(--ink); }
        .c2-index { grid-template-columns:1fr; }
        .c2-index div { border-right:0; border-bottom:1px solid var(--line); }
        .c2-section-head,.c2-feature { grid-template-columns:1fr; gap:18px; }
        .c2-projects { grid-template-columns:1fr; }
        .c2-personal { grid-template-columns:1fr; }
        .c2-personal img { height:360px; }
        .c2-personal div { padding:32px; }
        .c2-career,.c2-footer { grid-template-columns:1fr; }
        .d2-nav div a:nth-child(2) { display:none; }
        .d2-hero { grid-template-columns:1fr; grid-template-rows:auto; }
        .d2-intro { min-height:480px; }
        .d2-intro h1 { font-size:60px; }
        .d2-face { height:480px; }
        .d2-stat { min-height:185px; }
        .d2-head { display:block; }
        .d2-head p { margin-top:18px; }
        .d2-work-grid,.d2-projects { grid-template-columns:1fr; }
        .d2-work,.d2-work:nth-child(3n+1),.d2-work:nth-child(3n+2) { grid-column:auto; }
        .d2-profile-band { grid-template-columns:1fr; }
        .d2-profile-band img { height:360px; }
        .d2-profile-copy { padding:32px; }

      /* E — Reader's Edition. Portfolio as a carefully bound volume. */
      .layout-e { --cloth:#173b57; --cloth-dark:#0c263b; --paper:#ece8dc; --paper-deep:#ddd6c6; --ink:#24231f; --muted:#6f6a60; --edge:#a5333f; --gold:#d4aa48; min-height:100vh; color:var(--ink); background:#b8b2a8; font-family:Manrope,sans-serif; }
      .e-shell { width:min(1480px,100%); margin:auto; padding:28px clamp(18px,3.4vw,54px) 150px; }
      .e-reader-nav { position:relative; z-index:6; display:flex; align-items:center; justify-content:space-between; min-height:62px; margin-bottom:24px; padding:0 22px; border:1px solid rgba(236,232,220,.22); color:#f6f0df; background:var(--cloth-dark); box-shadow:0 8px 28px rgba(25,20,14,.22); }
      .e-reader-nav strong { font:500 16px Newsreader,serif; letter-spacing:.03em; }
      .e-reader-nav div { display:flex; gap:24px; }
      .e-reader-nav a { color:#d7dfe4; font:500 11px "DM Mono"; letter-spacing:.07em; text-decoration:none; text-transform:uppercase; }
      .e-spread { position:relative; display:grid; grid-template-columns:1fr 1fr; min-height:720px; margin:0 auto 70px; filter:drop-shadow(0 24px 24px rgba(46,35,24,.28)); perspective:1800px; }
      .e-spread::after { content:""; position:absolute; z-index:5; top:1%; bottom:1%; left:50%; width:24px; transform:translateX(-50%); background:linear-gradient(90deg,rgba(36,25,15,.18),rgba(255,255,255,.25) 47%,rgba(36,25,15,.2)); pointer-events:none; }
      .e-cover { position:relative; display:flex; flex-direction:column; padding:64px 62px 48px 82px; border:10px solid var(--cloth-dark); border-right:4px solid #071926; color:#f7f0df; background-color:var(--cloth); background-image:repeating-linear-gradient(92deg,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 4px); transform-origin:right center; animation:e-cover-in .8s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes e-cover-in { from { transform:rotateY(-7deg); opacity:.55; } to { transform:rotateY(0); opacity:1; } }
      .e-spine { position:absolute; left:0; top:0; bottom:0; width:42px; display:flex; align-items:center; justify-content:center; border-right:1px solid rgba(212,170,72,.6); color:var(--gold); background:#0d2a40; font:500 8px "DM Mono"; letter-spacing:.18em; text-transform:uppercase; writing-mode:vertical-rl; transform:rotate(180deg); }
      .e-cover-mark { width:54px; height:54px; display:grid; place-items:center; border:1px solid var(--gold); border-radius:50%; color:var(--gold); font:500 21px Newsreader,serif; }
      .e-cover small { margin-top:38px; color:#bac9d4; font:500 9px "DM Mono"; letter-spacing:.15em; text-transform:uppercase; }
      .e-cover h1 { max-width:650px; margin:18px 0 28px; font:500 clamp(62px,7vw,105px)/.82 Newsreader,serif; letter-spacing:-.055em; }

      /* F — Query Console. The portfolio becomes a browsable DuckDB dataset. */
      .layout-f { --paper:#dfe9e5; --ink:#10251f; --muted:#5d716a; --line:#a9bbb4; --terminal:#101c20; --terminal-line:#294047; --terminal-ink:#d9eee7; --signal:#e4ff70; --cyan:#65d8ca; min-height:100vh; color:var(--ink); background:var(--paper); font-family:Manrope,sans-serif; }

      .f-schema-head h2 { margin:0; font:600 18px "Space Grotesk",sans-serif; }

      .f-tree { margin:17px 0 0; padding:0; list-style:none; }

      .g-node-core { fill:var(--node-color); stroke:#101522; stroke-width:2; vector-effect:non-scaling-stroke; filter:drop-shadow(0 0 5px color-mix(in srgb,var(--node-color) 45%,transparent)); transition:opacity .16s; }
      .g-node[data-type="person"] { --node-color:var(--person); }
      .g-node[data-type="company"] { --node-color:var(--company); }
      .g-node[data-type="position"] { --node-color:var(--position); }

      .g-controls { position:absolute; z-index:4; top:13px; right:13px; display:flex; border:1px solid var(--line); background:rgba(23,29,46,.9); backdrop-filter:blur(8px); }

      .g-tooltip { position:absolute; z-index:6; max-width:270px; padding:8px 10px; border:1px solid #52607d; color:#f0f3f8; background:#20283a; pointer-events:none; opacity:0; font:400 12px/1.5 "DM Mono",monospace; transform:translate(10px,10px); }

      @media (max-width:820px) {

            </div>
          </section>

          <section class="e-book-page" id="e-work" data-folio="Chapter I · Professional work"><div class="e-chapter-head"><small>Chapter I<br>Professional work</small><h2>Systems built for the part that comes after launch.</h2></div>${renderProfessionalWork()}</section>

          <section class="e-bookshelf" id="e-shelf"><div class="e-bookshelf-head"><h2>The working library</h2><p>The languages, frameworks, and disciplines I return to while designing and delivering software.</p></div><div class="e-spines">${skills.map(s => `<article class="e-skill-spine"><h3>${s.group}</h3><p>${s.items}</p></article>`).join("")}</div></section>

          <section class="e-book-page" id="e-projects" data-folio="Chapter III · Public projects"><div class="e-chapter-head"><small>Chapter III<br>Public catalogue</small><h2>Projects and research.</h2></div><div class="e-catalogue">${publicProjects.map(p => `<article class="e-catalogue-card"><small>${p.year}<br>${p.kind}</small><div><h3>${p.title}</h3>${tagList(p.tags)}</div><p>${p.description}</p>${linkList(p.links)}</article>`).join("")}</div></section>

          <section class="e-book-page" id="e-experience" data-folio="Chapter IV · Experience"><div class="e-chapter-head"><small>Chapter IV<br>Chronology</small><h2>How my work has grown over time.</h2></div><div class="e-history">${experience.map(e => `<article class="e-role"><time>${e.dates}</time><h3>${e.role} · <span>${e.company}</span></h3><p>${e.description}</p></article>`).join("")}</div></section>

          <section class="e-book-page" id="e-colophon" data-folio="Chapter V · Notes & colophon"><div class="e-chapter-head"><small>Chapter V<br>Back matter</small><h2>Recognition, education, and publication notes.</h2></div><div class="e-colophon"><div><h2>Recognition</h2>${recognition.map(r => `<article><small>${r.year}</small><h3>${r.title}</h3></article>`).join("")}</div><div><h2>Education</h2><article><small>2019—2023</small><h3>BE Computer Science and Engineering · Nitte Meenakshi Institute of Technology · CGPA 9.09</h3></article></div></div></section>
        </div></div>`;
      }

      function renderF() {
        return `<div class="layout-f"><div class="f-shell">
          <nav class="f-nav"><strong>${profile.name} / Query Console</strong><div><span class="f-live">Runs in your browser</span><a href="${profile.email}">Contact</a></div></nav>
          <main class="f-workbench">
            <aside class="f-schema" aria-label="Database schema"><div><div class="f-schema-head"><h2>main</h2><span>Schema</span></div><ul class="f-tree"><li>companies <small>${companies.length} rows</small></li><li>positions <small>${positions.length} rows</small></li><li>work_points <small>${professional.length} rows</small></li><li>projects <small>${publicProjects.length} rows</small></li><li>profile <small>1 row</small></li><li>skills <small>${skills.length} rows</small></li><li>recognition <small>${recognition.length} rows</small></li><li>education <small>1 row</small></li><li>where_i_worked <small>view</small></li></ul></div><p class="f-schema-note">Start with <code>SELECT * FROM where_i_worked;</code>, inspect a table with <code>.schema positions</code>, or run any DuckDB SQL. Changes live only for this browser session.</p></aside>
            <section class="f-terminal" aria-label="Interactive DuckDB terminal">
              <header class="f-terminal-bar"><span class="f-dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="f-terminal-title">portfolio.duckdb — local session</span><span class="f-engine-state" id="f-engine-state" role="status">Loading database engine</span></header>
              <div class="f-examples" aria-label="Example queries"><span>Try</span><button class="f-example" type="button" data-query=".tables">.tables</button><button class="f-example" type="button" data-query="SELECT * FROM where_i_worked ORDER BY company;">Where I worked</button><button class="f-example" type="button" data-query="SELECT c.name AS company, p.title, strftime(p.start_date, '%b %Y') AS started, COALESCE(strftime(p.end_date, '%b %Y'), 'Present') AS ended FROM positions p JOIN companies c ON c.id = p.company_id ORDER BY p.start_date;">Position history</button><button class="f-example" type="button" data-query="SELECT c.name AS company, w.title, w.description, w.impact FROM work_points w JOIN companies c ON c.id = w.company_id ORDER BY c.name, w.id;">Work points</button></div>
              <div class="f-transcript" id="f-transcript" aria-live="polite"><div class="f-welcome"><b>DuckDB portfolio shell</b><br>Loading the database and résumé records…</div></div>
              <form class="f-query-form" id="f-query-form"><label class="f-input-wrap"><span class="f-prompt" aria-hidden="true">›</span><textarea class="f-query" id="f-query" name="query" rows="2" spellcheck="false" aria-label="SQL query" placeholder="SELECT * FROM where_i_worked;"></textarea></label><button class="f-run" id="f-run" type="submit" disabled>Run query</button><p class="f-hint">Enter to run · Shift + Enter for a new line · ↑↓ for query history · .help for commands</p></form>
            </section>
          </main>
        </div></div>`;
      }

      function renderG() {
        return `<div class="layout-g"><div class="g-shell">
          <nav class="g-nav"><strong>${profile.name} / Career Graph</strong><div><span class="g-status" id="g-status" role="status">Mapping connections</span><a href="${profile.email}">Contact</a></div></nav>
          <main class="g-workbench">
            <aside class="g-sidebar" aria-label="Graph controls and selected node">
              <div class="g-sidebar-head"><h2>Graph index</h2><span class="g-count" id="g-count">Building…</span></div>
              <div><span class="g-filter-title">Show nodes</span><div class="g-filters" id="g-filters">
                <button class="g-filter" type="button" data-type="person" aria-pressed="true"><span>Person</span><span></span></button>
                <button class="g-filter" type="button" data-type="company" aria-pressed="true"><span>Companies</span><span></span></button>
                <button class="g-filter" type="button" data-type="position" aria-pressed="true"><span>Positions</span><span></span></button>
                <button class="g-filter" type="button" data-type="work" aria-pressed="true"><span>Work points</span><span></span></button>
                <button class="g-filter" type="button" data-type="project" aria-pressed="true"><span>Projects</span><span></span></button>
                <button class="g-filter" type="button" data-type="technology" aria-pressed="true"><span>Technologies</span><span></span></button>
                <button class="g-filter" type="button" data-type="recognition" aria-pressed="true"><span>Recognition</span><span></span></button>
                <button class="g-filter" type="button" data-type="education" aria-pressed="true"><span>Education</span><span></span></button>
              </div></div>
              <section class="g-detail" id="g-detail" aria-live="polite"><small>Explore</small><h3>Select a node</h3><p class="g-detail-copy">Choose any point to isolate its immediate relationships. Drag nodes to rearrange the map; scroll or pinch to zoom.</p></section>
            </aside>
            <section class="g-canvas" id="g-canvas" aria-label="Interactive career knowledge graph">
              <svg class="g-svg" id="g-svg" role="img" aria-label="Graph connecting Sumedh’s companies, positions, work, projects, technologies, recognition, and education"></svg>
              <div class="g-controls" aria-label="Graph view controls"><button class="g-control" id="g-zoom-in" type="button" aria-label="Zoom in">+</button><button class="g-control" id="g-zoom-out" type="button" aria-label="Zoom out">−</button><button class="g-control" id="g-reset" type="button">Reset view</button></div>
              <p class="g-canvas-note">Drag to rearrange · Scroll to zoom · Select a node to trace its links</p>
              <div class="g-tooltip" id="g-tooltip" role="tooltip"></div>
            </section>
          </main>
        </div></div>`;
      }

      const variants = [
        { key:"E", name:"Reader’s Edition", render:renderE },
        { key:"A", name:"Profile + Archive", render:renderA },
        { key:"F", name:"Query Console", render:renderF },
        { key:"G", name:"Career Graph", render:renderG },
      ];

      function activateFilters() {
        document.querySelectorAll(".b-filter").forEach(button => button.addEventListener("click", () => {
          const filter = button.dataset.filter;
          document.querySelectorAll(".b-filter").forEach(item => item.classList.toggle("is-active", item === button));
          document.querySelectorAll(".b-card").forEach(card => { card.hidden = filter !== "All" && card.dataset.kind !== filter; });
        }));
      }

      function setVariant(key, updateUrl=true) {
        const selected = variants.find(v => v.key === String(key || "E").toUpperCase()) || variants[0];
        if (window.destroyCareerGraph) window.destroyCareerGraph();
        const returnToBook = selected.key === "E" ? "" : `<button class="edition-return" type="button" data-variant="E"><span aria-hidden="true">←</span> Back to Reader’s Edition</button>`;
        document.getElementById("portfolio-root").innerHTML = selected.render() + returnToBook;
        document.documentElement.dataset.currentVariant = selected.key;
        document.title = `${selected.name} · Sumedh S Bhat`;
        if (selected.key === "E" && new URL(location.href).searchParams.has("work")) { const cleanUrl = new URL(location.href); cleanUrl.searchParams.delete("work"); history.replaceState({},"",cleanUrl); }
        if (updateUrl) { const url = new URL(location.href); url.hash = ""; if (selected.key === "E") url.searchParams.delete("variant"); else url.searchParams.set("variant", selected.key); history.replaceState({},"",url); }
        activateFilters();
        if (selected.key === "F") window.activateDuckDbTerminal({ profile, companies, positions, professional, publicProjects, skills, recognition });
        if (selected.key === "G") window.activateCareerGraph({ profile, companies, positions, professional, publicProjects, skills, recognition });
        const hashTarget = location.hash ? document.querySelector(location.hash) : null;
        if (hashTarget) hashTarget.scrollIntoView({behavior:"instant"});
        else window.scrollTo({top:0,behavior:"instant"});
      }

      document.addEventListener("click", event => {
        const trigger = event.target.closest("[data-variant]");
        if (trigger) setVariant(trigger.dataset.variant);
      });
      setVariant(new URLSearchParams(location.search).get("variant") || "E", false);
    </script>
  </body>
</html>
